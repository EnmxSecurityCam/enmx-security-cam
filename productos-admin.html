<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Inventario | ENMX Security Cam</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#383126;--gold:#d7b568;--gold2:#f2d99b;--text:#f7f4ed;--muted:#aaa69b;--red:#ff9696;--green:#8ed6a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,94%);margin:auto}.top{padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:1.2px;color:var(--gold2)}.sub,.muted{color:var(--muted);font-size:.9rem}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;margin:20px 0}.hidden{display:none!important}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 8px}h2{font-size:1.2rem;margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select,.search{width:100%;padding:12px;border:1px solid #554a36;border-radius:9px;background:#090909;color:var(--text)}textarea{min-height:90px;resize:vertical}.btn{border:1px solid var(--gold);border-radius:9px;background:var(--gold);color:#15120b;font-weight:850;padding:11px 15px}.btn.secondary{background:transparent;color:var(--gold2)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.message{margin-top:12px;color:var(--muted);overflow-wrap:anywhere}.error{color:var(--red)}.success{color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0, .85fr) minmax(0,1.15fr);gap:18px}.productlist{display:grid;gap:11px}.item{display:grid;grid-template-columns:86px 1fr;gap:13px;border:1px solid var(--line);border-radius:12px;background:#101010;padding:12px}.item img{width:86px;height:86px;object-fit:contain;background:#191919;border-radius:8px}.item h3{margin:0 0 4px}.item .price{color:var(--gold2);font-weight:900}.item .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.item .actions button{padding:7px 10px;font-size:.85rem}.preview{width:100%;max-height:170px;object-fit:contain;background:#101010;border-radius:9px;border:1px solid var(--line);margin-top:8px}.checkbox{display:flex;gap:9px;align-items:center;margin:12px 0}.checkbox input{width:18px;height:18px;accent-color:var(--gold)}.stat{padding:12px;border:1px solid var(--line);border-radius:10px;background:#101010;margin:12px 0}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:15px}.btn{max-width:100%}.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}}
</style></head><body><header class="top"><div class="wrap"><div class="brand">ENMX SECURITY CAM · INVENTARIO</div><div class="sub">Gestión de catálogo · panel privado</div></div></header><main class="wrap">
<section id="login-panel" class="panel"><h1>Acceso de administrador</h1><p class="sub">Usa la misma cuenta autorizada de administración de ENMX.</p><form id="login-form"><label class="field">Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" id="login-button">Entrar al inventario</button><div id="login-message" class="message" role="status"></div></form></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><h1>Catálogo de productos</h1><div id="signed-in" class="sub"></div></div><div class="row"><a class="btn secondary" href="./store.html">Ver tienda</a><a class="btn secondary" href="./admin.html">Cotizaciones</a><button class="btn secondary" id="logout">Cerrar sesión</button></div></div><div class="stat"><strong id="count">0</strong> productos registrados · <span id="active-count">0</span> publicados</div><div id="global-message" class="message" role="status"></div></div>
<div class="layout"><section class="panel"><h2 id="form-title">Agregar producto</h2><form id="product-form"><input id="product-id" type="hidden"><label class="field">Nombre del producto *<input id="name" maxlength="160" required placeholder="Ej. Cámara IP 4MP exterior"></label><label class="field">Categoría *<input id="category" maxlength="80" list="categories-list" required placeholder="Cámaras, DVR/NVR, cables…"><datalist id="categories-list"><option>Cámaras</option><option>DVR / NVR</option><option>Kits de seguridad</option><option>Cables y conectores</option><option>Discos duros</option><option>Fuentes de poder</option><option>Accesorios</option><option>Wi-Fi</option><option>IP</option></datalist></label><label class="field">Precio de venta (RD$) *<input id="price" type="number" min="0" step=".01" required></label><label class="field">Unidades disponibles *<input id="stock" type="number" min="0" step="1" required value="1"></label><label class="field">Descripción<textarea id="description" maxlength="1200" placeholder="Características, resolución, compatibilidad, garantía…"></textarea></label><label class="field">URLs de imágenes (una por línea)<textarea id="images" placeholder="https://.../camara-frente.jpg&#10;https://.../camara-lado.jpg"></textarea></label><img id="preview" class="preview hidden" alt="Vista previa de la primera imagen"><label class="checkbox"><input id="featured" type="checkbox"> Destacar en la tienda</label><label class="checkbox"><input id="active" type="checkbox" checked> Publicar producto en el catálogo</label><div class="row"><button class="btn" id="save-product" type="submit">Guardar producto</button><button class="btn secondary" id="cancel-edit" type="button">Limpiar formulario</button></div><div id="form-message" class="message" role="status"></div></form></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>Inventario publicado y borradores</h2><button class="btn secondary" id="refresh">Actualizar</button></div><input class="search" id="search" type="search" placeholder="Buscar producto o categoría"><div id="product-list" class="productlist" style="margin-top:14px"></div></section></div></section></main>
<script>
(()=>{const URL="https://tedtxusrtytqnjxloqim.supabase.co",KEY="sb_publishable_HGsE9OPOuPS7iGbC4qUoeQ_FGTfGIrT",ADMIN_UID="bf585a90-413c-4330-9aef-12a702fd148d",SESSION_KEY="enmx_admin_session";const $=id=>document.getElementById(id);let session=null,products=[];function msg(id,t,k=""){$(id).textContent=t;$(id).className="message "+k}function logged(user){$("login-panel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("signed-in").textContent="Sesión iniciada: "+(user.email||"administrador")}function saveSession(v){session=v;try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(v))}catch{}}function clearSession(){session=null;try{sessionStorage.removeItem(SESSION_KEY)}catch{}$("dashboard").classList.add("hidden");$("login-panel").classList.remove("hidden");$("password").value=""}async function api(path,options={}){if(!session?.access_token)throw Error("La sesión expiró. Inicia sesión de nuevo.");const r=await fetch(URL+path,{...options,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(options.headers||{})}});if(r.status===401){clearSession();throw Error("Sesión expirada.")}if(!r.ok){let t=await r.text();try{const j=JSON.parse(t);t=j.message||j.details||j.hint||t}catch{}throw Error("Supabase ("+r.status+"): "+t.slice(0,260))}if(r.status===204)return null;return(r.headers.get("content-type")||"").includes("json")?r.json():null}async function login(email,password){const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||"Correo o contraseña incorrectos.");if(d.user?.id!==ADMIN_UID)throw Error("Esta cuenta no está autorizada como administrador.");saveSession(d);logged(d.user);await load()}function money(n){return new Intl.NumberFormat("es-DO",{style:"currency",currency:"DOP",maximumFractionDigits:2}).format(Number(n||0))}function image(p){return Array.isArray(p.images)&&p.images[0]?p.images[0]:p.image_url||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#191919"/><text x="50%" y="55%" fill="#d7b568" font-size="12" text-anchor="middle">ENMX</text></svg>')}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function load(){msg("global-message","Cargando inventario…");try{products=await api("/rest/v1/products?select=id,name,description,category,price_dop,stock,images,image_url,active,featured,created_at&order=created_at.desc&limit=500");if(!Array.isArray(products))products=[];render();msg("global-message","Inventario actualizado.","success")}catch(e){msg("global-message",e.message,"error")}}function render(){const term=$("search").value.trim().toLowerCase(),list=products.filter(p=>[p.name,p.category,p.description].some(x=>String(x||"").toLowerCase().includes(term)));$("count").textContent=products.length;$("active-count").textContent=products.filter(p=>p.active).length;const root=$("product-list");root.replaceChildren();if(!list.length){root.innerHTML='<div class="empty">No hay productos registrados o no hay resultados.</div>';return}list.forEach(p=>{const card=document.createElement("article");card.className="item";const im=document.createElement("img");im.src=image(p);im.alt=p.name;im.onerror=()=>{im.onerror=null;im.src=image({})};const body=document.createElement("div");body.innerHTML='<h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.category||"Sin categoría")+' · Stock: '+Number(p.stock||0)+'</div><div class="price">'+money(p.price_dop)+'</div><div class="muted">'+(p.active?"Publicado":"Oculto")+(p.featured?" · Destacado":"")+'</div>';const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("button");edit.className="btn secondary";edit.textContent="Editar";edit.onclick=()=>fill(p);const toggle=document.createElement("button");toggle.className="btn secondary";toggle.textContent=p.active?"Ocultar":"Publicar";toggle.onclick=async()=>{toggle.disabled=true;try{await api("/rest/v1/products?id=eq."+encodeURIComponent(p.id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({active:!p.active,updated_at:new Date().toISOString()})});await load()}catch(e){msg("global-message",e.message,"error");toggle.disabled=false}};const del=document.createElement("button");del.className="btn secondary";del.textContent="Eliminar";del.onclick=async()=>{if(!confirm("¿Eliminar "+p.name+" del inventario?"))return;del.disabled=true;try{await api("/rest/v1/products?id=eq."+encodeURIComponent(p.id),{method:"DELETE",headers:{"Prefer":"return=minimal"}});products=products.filter(x=>x.id!==p.id);render();msg("global-message","Producto eliminado.","success")}catch(e){msg("global-message",e.message,"error");del.disabled=false}};actions.append(edit,toggle,del);body.append(actions);card.append(im,body);root.append(card)})}function fill(p){$("product-id").value=p.id;$("name").value=p.name||"";$("category").value=p.category||"";$("price").value=p.price_dop??"";$("stock").value=p.stock??0;$("description").value=p.description||"";$("images").value=(Array.isArray(p.images)?p.images:(p.image_url?[p.image_url]:[])).join("\n");$("featured").checked=!!p.featured;$("active").checked=!!p.active;$("form-title").textContent="Editar producto";$("save-product").textContent="Guardar cambios";$("preview").classList.toggle("hidden",!($("images").value.trim()));if($("images").value.trim())$("preview").src=$("images").value.trim().split(/\n/)[0].trim();$("form-message").textContent="Editando: "+p.name;window.scrollTo({top:0,behavior:"smooth"})}function reset(){ $("product-form").reset();$("product-id").value="";$("stock").value=1;$("active").checked=true;$("form-title").textContent="Agregar producto";$("save-product").textContent="Guardar producto";$("preview").classList.add("hidden");msg("form-message","")}$("images").addEventListener("input",()=>{const src=$("images").value.trim().split(/\n/)[0]?.trim();$("preview").classList.toggle("hidden",!src);if(src)$("preview").src=src});$("preview").onerror=()=>{$("preview").alt="No se pudo cargar la imagen; revisa la URL."};$("product-form").addEventListener("submit",async e=>{e.preventDefault();const price=Number($("price").value),stock=Number($("stock").value);if(price<0||stock<0||!Number.isInteger(stock)){msg("form-message","El precio no puede ser negativo y el inventario debe ser un entero igual o mayor que cero.","error");return}const images=$("images").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(images.some(x=>!/^https:\/\//i.test(x))){msg("form-message","Usa URLs de imágenes que comiencen con https://.","error");return}const payload={name:$("name").value.trim(),category:$("category").value.trim(),price_dop:price,stock,description:$("description").value.trim()||null,images, image_url:images[0]||null,featured:$("featured").checked,active:$("active").checked,updated_at:new Date().toISOString()};const id=$("product-id").value;$("save-product").disabled=true;msg("form-message","Guardando producto…");try{if(id)await api("/rest/v1/products?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify(payload)});else await api("/rest/v1/products",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(payload)});reset();await load();msg("global-message",id?"Producto actualizado correctamente.":"Producto agregado correctamente.","success")}catch(err){msg("form-message",err.message,"error")}finally{$("save-product").disabled=false}});$("login-form").addEventListener("submit",async e=>{e.preventDefault();$("login-button").disabled=true;msg("login-message","Verificando acceso…");try{await login($("email").value.trim(),$("password").value)}catch(e){msg("login-message",e.message,"error")}finally{$("login-button").disabled=false;$("password").value=""}});$("logout").onclick=clearSession;$("refresh").onclick=load;$("search").oninput=render;$("cancel-edit").onclick=reset;try{const s=sessionStorage.getItem(SESSION_KEY);if(s){const d=JSON.parse(s);if(d.user?.id===ADMIN_UID&&d.access_token){session=d;logged(d.user);load()}else clearSession()}}catch{clearSession()}})();
</script></body></html>
